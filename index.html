<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>
  <main class="container">
    <section class="card">

      <!-- Left Result -->
      <div class="result">
        <h3>Your Result</h3>

        <div class="score-circle">
          <h1>76</h1>
          <p>of 100</p>
        </div>

        <h2>Great</h2>
        <p class="result-text">
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>

      <!-- Right Summary -->
      <div class="summary">
        <h3>Summary</h3>

        <div class="summary-item reaction">
          <div class="summary-left">
            <img src="./assets/images/icon-reaction.svg" alt="icon of reaction" />
            <span>Reaction</span>
          </div>
          <strong>80 <small>/ 100</small></strong>
        </div>

        <div class="summary-item memory">
          <div class="summary-left">
            <img src="./assets/images/icon-memory.svg" alt="icon of memory" />
            <span>Memory</span>
          </div>
          <strong>92 <small>/ 100</small></strong>
        </div>

        <div class="summary-item verbal">
          <div class="summary-left">
            <img src="./assets/images/icon-verbal.svg" alt="icon of verbal" />
            <span>Verbal</span>
          </div>
          <strong>61 <small>/ 100</small></strong>
        </div>

        <div class="summary-item visual">
          <div class="summary-left">
            <img src="./assets/images/icon-visual.svg" alt="icon of visual" />
            <span>Visual</span>
          </div>
          <strong>73 <small>/ 100</small></strong>
        </div>

        <button class="btn">Continue</button>
      </div>

    </section>
  </main>

</body>
</html>
